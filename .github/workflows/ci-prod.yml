name: CD — Deploy PROD

on:
  push:
    tags:
      - 'v*.*.*'          # se activa al crear un tag: git tag v1.0.0 && git push origin v1.0.0

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/brasaviva-api

jobs:
  test:
    name: 🧪 Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Ejecutar pruebas
        run: mvn test --no-transfer-progress

  build-prod:
    name: 🐳 Build imagen PROD
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata con el tag de versión
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build y push imagen de producción
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: 🚀 Desplegar a PROD
    needs: build-prod
    runs-on: ubuntu-latest
    environment: production           # se pausa aquí hasta la aprobación manual
    steps:
      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar variables de entorno en Azure PROD
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          app-settings-json: |
            [
              {"name": "SPRING_PROFILES_ACTIVE", "value": "docker"},
              {"name": "WEBSITES_PORT", "value": "8080"},
              {"name": "DB_HOST", "value": "${{ secrets.DB_HOST_PROD }}"},
              {"name": "DB_NAME", "value": "brasaviva"},
              {"name": "DB_USER", "value": "brasaviva"},
              {"name": "DB_PARAMS", "value": "?sslmode=require"},
              {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD_PROD }}"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET_PROD }}"}
            ]

      - name: Desplegar en Azure Web App (PROD)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          images: ${{ env.IMAGE_NAME }}:${{ needs.build-prod.outputs.version }}

  notify:
    name: 📣 Notificación
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del despliegue
        run: |
          echo "✅ PROD desplegado exitosamente"
          echo "Versión: ${{ github.ref_name }}"
          echo "URL: https://${{ secrets.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net/swagger-ui/index.html"