# Perfil "ssl": levanta la API en HTTPS (puerto 8443).
# Uso:  SSL_KEYSTORE_PASSWORD=<clave> mvn spring-boot:run -Dspring-boot.run.profiles=ssl
# El certificado se genera con scripts/generar-certificado.sh (NO se sube a Git).
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:restaurante.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=restaurante