spring.application.name=brasa-viva
server.port=8080

logging.level.root=INFO
logging.level.edu.escuelaing.dosw.brasaviva=DEBUG

brasaviva.capacidad-parrilla=8
brasaviva.hora-cierre=22:00
brasaviva.minutos-restriccion-cierre=30
brasaviva.minutos-corte-lento=25
brasaviva.capacidad-parqueadero=20
brasaviva.tarifa-parqueadero-hora=3000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brasaviva}
spring.datasource.username=${DB_USER:brasaviva}
spring.datasource.password=${DB_PASSWORD:brasaviva}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------- Seguridad ----------------
# JWT: en produccion el secreto SIEMPRE llega por la variable de entorno JWT_SECRET (Base64, minimo 256 bits).
# El valor por defecto es solo para desarrollo local y NO debe usarse en un despliegue.
jwt.secret=${JWT_SECRET:rb3BQWWa079P5Oq79RpoHb8a9vL+23BP6c9BPb9+aeo=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Origenes permitidos por CORS (separados por coma)
brasaviva.seguridad.cors-origenes=${CORS_ORIGENES:http://localhost:3000}

# Usuarios de ejemplo (uno por rol). Desactivar en produccion: SEED_USUARIOS=false
brasaviva.seguridad.seed-usuarios=${SEED_USUARIOS:true}
brasaviva.seguridad.seed-password=${SEED_PASSWORD:Brasa2026}

# Swagger: en produccion se apaga con SWAGGER_ENABLED=false (OWASP A05)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Nunca exponer el stack trace en las respuestas de error (OWASP A05)
server.error.include-stacktrace=never
server.error.include-message=never
