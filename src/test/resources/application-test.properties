# Perfil "test": base de datos H2 en memoria para las pruebas de integracion (no requiere PostgreSQL).
spring.datasource.url=jdbc:h2:mem:brasaviva-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Las pruebas crean sus propios usuarios
brasaviva.seguridad.seed-usuarios=false